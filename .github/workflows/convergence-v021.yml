name: Eidos Convergence v0.2.1

on:
  pull_request:
  push:
    branches:
      - convergence/upstream-readiness-v0.2.1

jobs:
  eidos-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:repo

  convergence-local-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/compat/convergence-v021-local-invariants.test.mjs

  convergence-canonical-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: eidos
      - uses: actions/checkout@v4
        with:
          repository: jiangxng/EVO-EC-Eidos-Convergence
          ref: certification/v0.2.1-proof
          path: convergence
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: eidos/package-lock.json
      - working-directory: eidos
        run: npm ci
      - working-directory: eidos
        run: npm run build
      - working-directory: eidos
        env:
          CONVERGENCE_FIXTURES_DIR: ../convergence/fixtures/v0.2.1
        run: node --test tests/compat/convergence-v021-canonical.test.mjs
      - working-directory: eidos
        env:
          CONVERGENCE_FIXTURES_DIR: ../convergence/fixtures/v0.2.1
          EIDOS_CONVERGENCE_ADAPTER: tools/convergence-v021-fixture-adapter.mjs
        run: node tools/convergence-fixture-harness.mjs
