name: Eidos Diagram v1 Historic Stack Retirement
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "repository-hygiene/diagram-v1-eidos-stacked-head-retirement-20261012.json"
      - ".github/workflows/diagram-v1-eidos-stack-retirement-20261012.yml"
      - "docs/architecture/DIAGRAM-V1-COMMERCIAL-STACK-RETIREMENT-20261012.md"
  push:
    branches: [main]
    paths:
      - "repository-hygiene/diagram-v1-eidos-stacked-head-retirement-20261012.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-retire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/github-script@v7
        env:
          EXECUTE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.number == 173) }}
        with:
          script: |
            const fs=require('node:fs');
            const {owner,repo}=context.repo;
            const execute=process.env.EXECUTE==='true';
            if(owner!=='jiangxng'||repo!=='eidos')throw Error('Wrong Eidos owner');
            const m=JSON.parse(fs.readFileSync('repository-hygiene/diagram-v1-eidos-stacked-head-retirement-20261012.json','utf8'));
            const sha=/^[0-9a-f]{40}$/i;
            if(m.schemaVersion!==1||m.scope!=='eidos-2d-commercial-stack-20261012'||
               m.mergedCorePr!==160||m.sideDocsPr!==156||m.missingMergedOriginalRefPr!==159||
               m.records?.length!==29||!sha.test(m.coreOriginalHeadSha))
              throw Error('Unexpected Eidos manifest');
            const corePr=await github.rest.pulls.get({owner,repo,pull_number:160});
            if(!corePr.data.merged||corePr.data.head.sha!==m.coreOriginalHeadSha||
               corePr.data.base.ref!=='main')throw Error('Core #160 not trusted');
            const seen=new Set(),refs=new Set();
            for(const r of m.records){
              if(!Number.isInteger(r.number)||r.number<130||r.number>159||r.number===142||
                 seen.has(r.number)||refs.has(r.head)||!sha.test(r.expectedHeadSha)||
                 r.head.includes('agent/')||r.head==='main')
                throw Error('Unexpected staged PR '+r.number);
              seen.add(r.number);refs.add(r.head);
              const p=(await github.rest.pulls.get({owner,repo,pull_number:r.number})).data;
              if(p.head.sha!==r.expectedHeadSha||p.head.ref!==r.head||
                 p.head.repo?.full_name!==owner+'/'+repo)
                throw Error('Staged PR provenance drift #'+r.number);
              if(r.number!==156&&r.number!==159){
                const cmp=(await github.rest.repos.compareCommits({owner,repo,base:r.expectedHeadSha,head:m.coreOriginalHeadSha})).data;
                if(cmp.behind_by!==0||cmp.merge_base_commit?.sha!==r.expectedHeadSha||
                   !['ahead','identical'].includes(cmp.status))throw Error('Not a #160 source ancestor #'+r.number);
              }
              if(r.existsBefore){
                if(r.refSha!==r.expectedHeadSha)throw Error('Bad original SHA '+r.head);
                let ref=null;
                try {ref=(await github.rest.git.getRef({owner,repo,ref:'heads/'+r.head})).data;}
                catch(err){
                  // GitHub auto-deleted #130 source ref after its ancestry-only #172 merge.
                  // This exception is exact-PR/SHA and only when GitHub confirms merged.
                  if(!(err.status===404 && r.number===130 && p.merged &&
                       p.merge_commit_sha==='99cf0dbd15cb265823730180ca591f1440612261'))
                    throw err;
                  core.info('EIDOS_ALREADY_AUTO_RETIRED_130 '+r.head);
                }
                if(ref && ref.object.sha!==r.expectedHeadSha)
                  throw Error('Live staged head drift '+r.head);
                if(ref && (await github.rest.repos.getBranch({owner,repo,branch:r.head})).data.protected)
                  throw Error('Protected old source branch '+r.head);
              }else if(r.number!==159)throw Error('Unexpected preexisting missing branch');
              core.info('EIDOS_LEGACY_VERIFIED #'+r.number+' '+r.head);
            }
            if(seen.size!==29||!seen.has(156)||!seen.has(159))throw Error('Incomplete PR chain');
            const old=m.extraOldStandalone;
            if(old.head!=='feat/diagram-obstacle-routing-b1-20261009'||!sha.test(old.expectedHeadSha))
              throw Error('Wrong standalone source');
            const oldRef=(await github.rest.git.getRef({owner,repo,ref:'heads/'+old.head})).data;
            if(oldRef.object.sha!==old.expectedHeadSha)throw Error('Standalone source changed');
            if((await github.rest.repos.getBranch({owner,repo,branch:old.head})).data.protected)
              throw Error('Protected standalone source');
            if(!execute){core.info('EIDOS_STACK_AUDIT_ONLY=29');return;}
            const mergedClose=context.eventName==='pull_request' && context.payload.action==='closed' &&
              context.payload.pull_request?.number===173 && context.payload.pull_request?.merged===true;
            if(!(context.eventName==='push'&&context.ref==='refs/heads/main')&&!mergedClose)
              throw Error('Not an authorized merged main/PR-close event');
            const mainSha=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            const ancestral=[m.baselineMainSha,m.coreOriginalHeadSha,
              m.records.find(x=>x.number===156).expectedHeadSha,old.expectedHeadSha];
            for(const ancestor of ancestral){
              const cmp=(await github.rest.repos.compareCommits({owner,repo,base:ancestor,head:mainSha})).data;
              if(cmp.behind_by!==0||cmp.merge_base_commit?.sha!==ancestor||
                 !['ahead','identical'].includes(cmp.status))
                throw Error('Archive parent not in main '+ancestor);
            }
            const cleanup=(await github.rest.pulls.get({owner,repo,pull_number:172})).data;
            if(!cleanup.merged||cleanup.state!=='closed'||cleanup.base.ref!=='main'||
               cleanup.head.ref!=='chore/diagram-v1-commercial-stack-retirement-20261012'||
               !sha.test(cleanup.head.sha))throw Error('Cleanup PR #172 not merged');
            const finalCmp=(await github.rest.repos.compareCommits({owner,repo,base:cleanup.head.sha,head:mainSha})).data;
            if(finalCmp.behind_by!==0||finalCmp.merge_base_commit?.sha!==cleanup.head.sha)
              throw Error('Cleanup head missing in main ancestry');
            // Close only this exact already-superseded 2D diagram stack. Do not close Agent #142.
            for(const r of m.records){
              const p=(await github.rest.pulls.get({owner,repo,pull_number:r.number})).data;
              if(p.head.ref!==r.head||p.head.sha!==r.expectedHeadSha)
                throw Error('PR changed just before close #'+r.number);
              if(p.state==='open'){
                await github.rest.pulls.update({owner,repo,pull_number:r.number,state:'closed'});
                core.info('EIDOS_STAGED_PR_CLOSED #'+r.number);
              }else if(p.merged){
                core.info('EIDOS_STAGED_PR_ALREADY_MERGED #'+r.number);
              }
            }
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            let driver=null;
            if(mergedClose){
              driver=(await github.rest.pulls.get({owner,repo,pull_number:173})).data;
              if(!driver.merged||driver.state!=='closed'||driver.base.ref!=='main'||
                 driver.head.ref!=='chore/diagram-v1-eidos-postmerge-retirement-20261012'||
                 driver.head.sha!==context.payload.pull_request.head.sha)
                throw Error('Driver PR #173 provenance mismatch');
              const d=(await github.rest.repos.compareCommits({owner,repo,base:driver.head.sha,head:mainSha})).data;
              if(d.behind_by!==0||d.merge_base_commit?.sha!==driver.head.sha)
                throw Error('Driver PR not part of current main');
            }
            const toDelete=[
              ...m.records.filter(x=>x.existsBefore && x.number!==130).map(x=>({head:x.head,expectedHeadSha:x.expectedHeadSha})),
              old,
              {head:'chore/diagram-v1-commercial-stack-retirement-20261012',expectedHeadSha:cleanup.head.sha},
              ...(driver?[{head:'chore/diagram-v1-eidos-postmerge-retirement-20261012',expectedHeadSha:driver.head.sha}]:[])
            ];
            for(const r of toDelete){
              if(open.some(p=>p.base.ref===r.head||
                 (p.head.repo?.full_name===owner+'/'+repo&&p.head.ref===r.head)))
                throw Error('Open dependency prevents deletion '+r.head);
              const ref=(await github.rest.git.getRef({owner,repo,ref:'heads/'+r.head})).data;
              if(ref.object.sha!==r.expectedHeadSha)throw Error('Retirement SHA drift '+r.head);
              if((await github.rest.repos.getBranch({owner,repo,branch:r.head})).data.protected)
                throw Error('Protected source '+r.head);
            }
            for(const r of toDelete){
              const ref=(await github.rest.git.getRef({owner,repo,ref:'heads/'+r.head})).data;
              if(ref.object.sha!==r.expectedHeadSha)throw Error('Lease changed '+r.head);
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+r.head});
              core.info('EIDOS_LEGACY_REF_DELETED '+r.head);
            }
            core.info('EIDOS_LEGACY_RETIRED_COUNT='+toDelete.length);
